name: Backend checks

on:
  # Exact-head validation for the currently nonactivated unified-signup
  # candidate. Its contents-API commits do not consistently dispatch PR CI.
  push:
    branches:
      - feat/unified-mandatory-plc-identity
    paths:
      - 'pod-provider/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'pod-provider/backend/**'
      - 'tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Never accumulate an unbounded queue of expensive PG/Jena and backend builds
# for superseded commits on the same PR. Other PRs stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pod-provider/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: pod-provider/backend/yarn.lock

      - name: Enforce HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Normalize legacy SSH Git URLs in backend lockfile
        run: |
          if [ -f yarn.lock ]; then
            sed -i 's#ssh://git@github.com/#https://github.com/#g' yarn.lock
            sed -i 's#git+ssh://git@github.com/#git+https://github.com/#g' yarn.lock
            sed -i 's#git@github.com:#https://github.com/#g' yarn.lock
          fi

      - name: Syntax-check collective backend changes before dependency installation
        working-directory: .
        run: |
          set -euo pipefail
          for file in pod-provider/backend/services/collective-*.js \
                      pod-provider/backend/services/utils/collective-*.js \
                      pod-provider/backend/tests/collective-*.test.js \
                      pod-provider/backend/tests/oauth-dpop-bound-resource.test.js \
                      pod-provider/backend/scripts/proof-collective-fuseki.js \
                      pod-provider/backend/scripts/proof-collective-consent-fence.js \
                      pod-provider/backend/scripts/proof-collective-sai-persistence.js \
                      pod-provider/backend/scripts/proof-collective-provider-http-server.js \
                      pod-provider/backend/scripts/proof-collective-provider-http.js \
                      pod-provider/backend/scripts/proof-collective-provider-oidc.js \
                      pod-provider/backend/scripts/recover-collective-consent-offline.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done

      - name: Install system libvips for reproducible Sharp native build
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips-dev pkg-config build-essential python3
          pkg-config --modversion vips-cpp

      - name: Install backend dependencies
        env:
          SHARP_FORCE_GLOBAL_LIBVIPS: '1'
          npm_config_build_from_source: 'true'
        run: |
          set -euo pipefail
          # Preserve real postinstall/native dependency behavior. Sharp's
          # upstream libvips release download occasionally returns 504;
          # retry boundedly rather than silently skipping build scripts.
          for attempt in 1 2 3; do
            if yarn install; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Backend dependency installation failed after 3 attempts"
              exit 1
            fi
            delay=$(( 7 * attempt * attempt ))
            echo "::warning::Dependency installation failed; retry $(( attempt + 1 ))/3 in ${delay}s"
            sleep "$delay"
          done

      - name: Report backend lockfile drift
        run: |
          if ! git diff --quiet -- yarn.lock; then
            echo '::warning file=pod-provider/backend/yarn.lock::yarn.lock is out of sync with package.json or contains legacy SSH Git URLs. Run `cd pod-provider/backend && yarn install`, ensure GitHub Git dependencies use HTTPS, then commit yarn.lock.'
            git --no-pager diff -- yarn.lock | sed -n '1,240p'
          fi

      - name: Run stable backend unit tests
        working-directory: .
        run: |
          npm exec --yes \
            --package=jest@29.7.0 \
            --package=esbuild@0.25.4 \
            --package=esbuild-jest@0.5.0 \
            -- \
            jest --testEnvironment=node \
              --roots=pod-provider/backend/tests \
              --testPathIgnorePatterns='hashtag-conformance-matrix.test.js'

      - name: Run offline ATProto multibase smoke test
        run: yarn test:atproto:multibase
