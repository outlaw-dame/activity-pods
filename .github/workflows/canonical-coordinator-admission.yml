name: Canonical coordinator admission
on:
  pull_request:
    paths:
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/**'
      - 'pod-provider/backend/candidates/postgres-account-lifecycle.js'
      - 'pod-provider/backend/candidates/provider-*-enrollment*.js'
      - 'pod-provider/backend/candidates/provider-enrollment-handoff.js'
      - 'pod-provider/backend/candidates/browser-signup-transaction.js'
      - 'pod-provider/backend/candidates/local-browser-signup-verifier.js'
      - 'pod-provider/backend/scripts/issue-local-signup-invitation.cjs'
      - 'pod-provider/backend/sql/paper-browser-signup-transaction.sql'
      - 'pod-provider/backend/sql/paper-provider-genesis-*.sql'
      - 'pod-provider/backend/services/unified-account-api.service.js'
      - 'pod-provider/backend/services/utils/atproto-account-coordinated-signup.js'
      - 'pod-provider/backend/sql/paper-account-postgres-candidate-*.sql'
      - 'pod-provider/backend/sql/paper-provider-*.sql'
      - 'pod-provider/backend/sql/paper-local-native-auth.sql'
      - 'pod-provider/backend/sql/paper-atproto-canonical-authority-v1.sql'
      - 'pod-provider/backend/tests/canonical-coordinator-admission-node.test.cjs'
      - '.github/workflows/canonical-coordinator-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-canonical-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_local_plc
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: paper_local_plc
        ports:
          - 127.0.0.1:5549:5432
        options: >-
          --health-cmd "pg_isready -U paper_local_plc -d paper_local_plc"
          --health-interval 2s --health-timeout 3s --health-retries 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked backend dependencies
        run: npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Write disposable connection configuration
        run: |
          umask 077
          printf '%s\n' '{"databaseUrl":"postgres://paper_local_plc:disposable_ci_only@127.0.0.1:5549/paper_local_plc"}' > "$RUNNER_TEMP/enrollment.json"
      - name: Exercise restricted canonical admission, duplicates and uncertain outcomes
        env:
          NODE_ENV: test
          APODS_ACCOUNT_COORDINATOR_DISPOSABLE: confirmed
          PAPER_ACCOUNTS_DISPOSABLE: confirmed
          PAPER_BROWSER_ENROLLMENT_DISPOSABLE: confirmed
          APODS_ACCOUNT_RESERVATION_DISPOSABLE: confirmed
          ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
          PAPER_ENROLLMENT_TEST_CONFIG: ${{ runner.temp }}/enrollment.json
        run: node --test pod-provider/backend/tests/canonical-coordinator-admission-node.test.cjs
