# Independent, throwaway Shiro admission proof. Not the live SemApps/Jena service.
# The private bind mount is prepared by the workflow and destroyed on cleanup.
services:
  fuseki_isolation:
    image: semapps/jena-fuseki-webacl
    # The inherited image entrypoint rewrites shiro.ini with admin-only credentials.
    # Bypass that installer only in this isolated, disposable proof.
    # Keep the image's secured model and evaluator on the launcher's classpath.
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        if [ ! -e /fuseki/extra ]; then ln -s /jena-fuseki/extra /fuseki/extra; fi
        test "$$(readlink /fuseki/extra)" = /jena-fuseki/extra
        exec /jena-fuseki/fuseki-server
    ports:
      - '127.0.0.1:3041:3030'
    volumes:
      - ./data/fuseki_isolation:/fuseki:z
    environment:
      ADMIN_PASSWORD: 'fixture-admin-only'
