# Disposable CI fixture ONLY. Plaintext credentials must never be deployed.
# Apache Jena Fuseki Full / Apache Shiro: first matching URL rule wins.
# Authoritative docs: https://jena.apache.org/documentation/fuseki2/fuseki-security.html
[users]
# The SemApps evaluator recognizes the principal named admin for X-SemappsUser.
# Shiro grants Fuseki administration only to the separate provisioner.
fixture-provisioner = fixture-admin-only, admins
fixture-projector = fixture-projector-only,projectors,protected-readers
fixture-binding-index = fixture-binding-index-only, binding-index
fixture-attestor = fixture-attestor-only,protected-readers
admin = fixture-ordinary-only, ordinary, claim-pod-data

[urls]
/$/ping = anon
/$/** = authcBasic,roles[admins]
/binding-index-proof/query = authcBasic,roles[binding-index]
/binding-index-proof/update = authcBasic,roles[binding-index]
/protected-proof/query = authcBasic,roles[protected-readers]
/protected-proof/update = authcBasic,roles[projectors]
/protected-proof/** = authcBasic,roles[projectors]
/protected-proof = authcBasic,roles[projectors]
# Signed rehearsal Pods expose only SPARQL data endpoints to the provider.
/claimtest-*/query = authcBasic,roles[claim-pod-data]
/claimtest-*/update = authcBasic,roles[claim-pod-data]
/ordinary-proof/query = authcBasic,roles[ordinary]
/ordinary-proof/update = authcBasic,roles[ordinary]
/ordinary-proof/** = authcBasic,roles[ordinary]
/ordinary-proof = authcBasic,roles[ordinary]
/** = authcBasic,roles[admins]
