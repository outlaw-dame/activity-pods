name: Paper Account PostgreSQL Lifecycle Candidate

on:
  pull_request:
    paths:
      - 'pod-provider/backend/sql/paper-account-postgres-lifecycle-candidate-v1.sql'
      - 'pod-provider/backend/tests/sql/paper-account-postgres-lifecycle-proof.sql'
      - 'pod-provider/backend/tests/sql/paper-account-postgres-concurrency-proof.sh'
      - 'pod-provider/backend/tests/sql/paper-account-postgres-adapter-proof.js'
      - 'pod-provider/backend/candidates/account-postgres-lifecycle.js'
      - 'pod-provider/backend/utils/unified-identity-policy.js'
      - '.github/workflows/paper-account-postgres-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres:
    name: PostgreSQL 18 lifecycle constraints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Start isolated PostgreSQL 18 database
        run: |
          set -euo pipefail
          docker run --rm -d --name paper-account-pg-test \
            -e POSTGRES_PASSWORD=disposable-ci-only \
            -e POSTGRES_DB=paper_account_disposable \
            -p 127.0.0.1:15432:5432 \
            postgres:18
          # pg_isready can briefly report healthy while initdb's temporary
          # postmaster is stopping. Require a *real query* against the final
          # database, then recheck after one second before starting DDL.
          for attempt in $(seq 1 90); do
            if docker exec -e PGPASSWORD=disposable-ci-only paper-account-pg-test \
                psql -X -Atqc 'SELECT 1' -U postgres -d paper_account_disposable \
                2>/dev/null | grep -qx 1; then
              sleep 1
              if docker exec -e PGPASSWORD=disposable-ci-only paper-account-pg-test \
                  psql -X -Atqc 'SELECT 1' -U postgres -d paper_account_disposable \
                  2>/dev/null | grep -qx 1; then exit 0; fi
            fi
            sleep 1
          done
          docker logs paper-account-pg-test 2>&1 | tail -n 70
          exit 1
      - name: Verify candidate schema and fail-closed transitions
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD=disposable-ci-only paper-account-pg-test \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d paper_account_disposable \
            < pod-provider/backend/sql/paper-account-postgres-lifecycle-candidate-v1.sql
          docker exec -i -e PGPASSWORD=disposable-ci-only paper-account-pg-test \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d paper_account_disposable \
            < pod-provider/backend/tests/sql/paper-account-postgres-lifecycle-proof.sql
      - name: Concurrent reservations and restart durability
        run: |
          set -euo pipefail
          bash pod-provider/backend/tests/sql/paper-account-postgres-concurrency-proof.sh
          docker restart paper-account-pg-test >/dev/null
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec -e PGPASSWORD=disposable-ci-only paper-account-pg-test \
                psql -X -Atqc "SELECT count(*) FROM paper_account_candidate.operations WHERE username_key='same_concurrent_name';" \
                -U postgres -d paper_account_disposable 2>/dev/null | grep -qx 1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          echo 'account_pg_restart_durability_passed'

      - name: Verify live candidate adapter across two PostgreSQL pools
        run: |
          set -euo pipefail
          # Non-production dependencies are isolated in RUNNER_TEMP.
          # No Node dependency is added to the deployed ActivityPods backend.
          npm install --prefix "$RUNNER_TEMP/paper-account-pg-proof" \
            --no-save --ignore-scripts --no-audit --no-fund \
            pg@8.16.3 moleculer@0.14.19 >/dev/null
          NODE_PATH="$RUNNER_TEMP/paper-account-pg-proof/node_modules" \
            node pod-provider/backend/tests/sql/paper-account-postgres-adapter-proof.js

      - name: Remove disposable database
        if: always()
        run: docker rm -f paper-account-pg-test >/dev/null 2>&1 || true
