name: Paper independent credential head HTTPS — nonactivated

on:
  pull_request:
    paths:
      - '.github/workflows/paper-credential-head-https.yml'
      - 'pod-provider/backend/candidates/credential-signed-head-https-transport.js'
      - 'pod-provider/backend/candidates/credential-signed-latest-head.js'
      - 'pod-provider/backend/scripts/proof-paper-credential-head-https.cjs'
      - 'docs/paper-credential-independent-head-transport.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: paper-independent-head-https-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tls-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
      PAPER_CREDENTIAL_HEAD_DISPOSABLE: confirmed
      PAPER_CREDENTIAL_HTTPS_DISPOSABLE: confirmed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and nonactivation boundary
        run: |
          set -euo pipefail
          node --check pod-provider/backend/candidates/credential-signed-head-https-transport.js
          node --check pod-provider/backend/scripts/proof-paper-credential-head-https.cjs
          openssl version
          grep -q 'NONACTIVATED' pod-provider/backend/candidates/credential-signed-head-https-transport.js
          if grep -R -n 'credential-signed-head-https-transport' pod-provider/backend/services pod-provider/backend/moleculer.config.js; then
            echo '::error::External credential-head transport must not auto-activate'
            exit 1
          fi
      - name: Prove real TLS and nonce-signed head response refusal
        run: node pod-provider/backend/scripts/proof-paper-credential-head-https.cjs
