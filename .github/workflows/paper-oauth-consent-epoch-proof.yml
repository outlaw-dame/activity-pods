name: Paper PDS OAuth consent epoch and refresh replay proof — Redis 8.2

on:
  pull_request:
    paths:
      - '.github/workflows/paper-oauth-consent-epoch-proof.yml'
      - 'pod-provider/backend/services/oauth/oauth-consent.service.js'
      - 'pod-provider/backend/services/oauth/oauth-code-store.service.js'
      - 'pod-provider/backend/services/oauth/oauth-authorization.service.js'
      - 'pod-provider/backend/services/oauth/oauth-token.service.js'
      - 'pod-provider/backend/services/oauth/oauth-refresh-session.service.js'
      - 'pod-provider/backend/services/oauth/oauth-refresh-atomic-policy.js'
      - 'pod-provider/backend/scripts/proof-oauth-consent-refresh-redis.js'
      - 'pod-provider/backend/scripts/proof-provider-pds-oauth.js'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/provider-pds-write-oauth.mjs'
  push:
    branches: [master]
    paths:
      - '.github/workflows/paper-oauth-consent-epoch-proof.yml'
      - 'pod-provider/backend/services/oauth/**'
      - 'pod-provider/backend/scripts/proof-oauth-consent-refresh-redis.js'
      - 'pod-provider/backend/scripts/proof-provider-pds-oauth.js'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/provider-pds-write-oauth.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-consent-epoch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redis-oauth-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6398:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PAPER_OAUTH_EPOCH_REDIS_DISPOSABLE: confirmed
      PAPER_OAUTH_EPOCH_REDIS_URL: redis://127.0.0.1:6398
      ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
      ATPROTO_PDS_WRITE_TEST_DISPOSABLE: confirmed
      ATPROTO_PDS_OAUTH_TEST_DISPOSABLE: confirmed
      ATPROTO_PDS_OAUTH_REDIS_URL: redis://127.0.0.1:6398
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check OAuth, replay and PDS authority
        run: |
          set -euo pipefail
          node --check pod-provider/backend/services/oauth/oauth-consent.service.js
          node --check pod-provider/backend/services/oauth/oauth-code-store.service.js
          node --check pod-provider/backend/services/oauth/oauth-authorization.service.js
          node --check pod-provider/backend/services/oauth/oauth-token.service.js
          node --check pod-provider/backend/services/oauth/oauth-refresh-session.service.js
          node --check pod-provider/backend/services/oauth/oauth-refresh-atomic-policy.js
          node --check pod-provider/backend/scripts/proof-oauth-consent-refresh-redis.js
          node --check pod-provider/backend/scripts/proof-provider-pds-oauth.js
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/provider-pds-write-oauth.mjs
      - name: Install exact locked backend runtime without package scripts
        run: |
          set -euo pipefail
          npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Verify Redis 8.2 consent epoch and two-replica refresh CAS
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-oauth-consent-refresh-redis.js
      - name: Verify provider signed DPoP PDS and revoke-reapprove
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-provider-pds-oauth.js
