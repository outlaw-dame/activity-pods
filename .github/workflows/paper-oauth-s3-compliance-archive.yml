name: Paper OAuth immutable S3 COMPLIANCE readback contract — NONACTIVATED

on:
  pull_request:
    paths:
      - '.github/workflows/paper-oauth-s3-compliance-archive.yml'
      - 'pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs'
      - 'pod-provider/backend/candidates/oauth-r2-receipt-archive.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs'
      - 'pod-provider/backend/candidates/oauth-r2-signed-checkpoint.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-r2-signed-checkpoint.mjs'
      - 'pod-provider/backend/candidates/oauth-s3-independent-custody.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs'
      - 'pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs'
      - 'pod-provider/backend/candidates/oauth-portable-s3-custody-readonly.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-portable-s3-custody.mjs'
      - 'pod-provider/backend/scripts/probe-oauth-portable-s3-custody.mjs'
      - 'pod-provider/backend/candidates/oauth-portable-s3-receipt-writer.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-portable-s3-receipt-writer.mjs'
      - 'pod-provider/backend/candidates/oauth-portable-s3-writeonce-probe.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-portable-s3-writeonce.mjs'
      - 'pod-provider/backend/scripts/probe-oauth-portable-s3-writeonce.mjs'
      - 'docs/paper-s3-archive-provider-qualification.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-oauth-s3-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s3-compliance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      PAPER_OAUTH_S3_COMPLIANCE_DISPOSABLE: confirmed
    steps:
      - name: Checkout immutable PR source without GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject source syntax or accidental production activation
        shell: bash
        run: |
          set -euo pipefail
          node --check pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs
          node --check pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          node --check pod-provider/backend/candidates/oauth-r2-receipt-archive.mjs
          node --check pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs
          node pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs
          node --check pod-provider/backend/candidates/oauth-r2-signed-checkpoint.mjs
          node --check pod-provider/backend/scripts/proof-oauth-r2-signed-checkpoint.mjs
          node pod-provider/backend/scripts/proof-oauth-r2-signed-checkpoint.mjs
          node --check pod-provider/backend/candidates/oauth-s3-independent-custody.mjs
          node --check pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
          node --check pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs
          node --check pod-provider/backend/candidates/oauth-portable-s3-custody-readonly.mjs
          node --check pod-provider/backend/scripts/proof-oauth-portable-s3-custody.mjs
          node --check pod-provider/backend/scripts/probe-oauth-portable-s3-custody.mjs
          node --check pod-provider/backend/candidates/oauth-portable-s3-receipt-writer.mjs
          node --check pod-provider/backend/scripts/proof-oauth-portable-s3-receipt-writer.mjs
          PAPER_OAUTH_PORTABLE_WORM_DISPOSABLE=confirmed node pod-provider/backend/scripts/proof-oauth-portable-s3-receipt-writer.mjs
          node --check pod-provider/backend/candidates/oauth-portable-s3-writeonce-probe.mjs
          node --check pod-provider/backend/scripts/proof-oauth-portable-s3-writeonce.mjs
          node --check pod-provider/backend/scripts/probe-oauth-portable-s3-writeonce.mjs
          node pod-provider/backend/scripts/proof-oauth-portable-s3-writeonce.mjs
          node pod-provider/backend/scripts/proof-oauth-portable-s3-custody.mjs
          if grep -R -nE 'oauth-portable-s3-custody-readonly|probe-oauth-portable-s3-custody|oauth-portable-s3-receipt-writer|oauth-portable-s3-writeonce-probe|probe-oauth-portable-s3-writeonce' pod-provider/backend/services; then
            echo '::error::Do not wire unapproved portable S3 evidence into production'
            exit 1
          fi
          grep -q 'NONACTIVATED' pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs
          if grep -R -nE 'oauth-(s3-(compliance-archive|independent-custody)|r2-receipt-archive)' pod-provider/backend/services; then
            echo '::error::Do not wire an unapproved S3 adapter or custody probe into production services'
            exit 1
          fi
      - name: Run deterministic fail-closed archival contract
        shell: bash
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          node pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
      - name: Reject operator endpoint and custom CA spoofing before SDK startup
        shell: bash
        env:
          NODE_ENV: production
          PAPER_WORM_CUSTODY_OPERATOR_CONFIRM: read-only-verified
          PAPER_WORM_SDK_ROOT: /tmp/nonexistent-worm-sdk
          PAPER_WORM_PROVIDER_PROFILE: provider-fake
          PAPER_WORM_READER_PROFILE: archive-fake
          PAPER_WORM_PROVIDER_ACCOUNT_ID: "111122223333"
          PAPER_WORM_ARCHIVE_ACCOUNT_ID: "999988887777"
          PAPER_WORM_BUCKET: paper-disposable-only
          PAPER_WORM_REGION: us-east-1
          PAPER_WORM_CUSTODY_PHASE: preflight
        run: |
          set -euo pipefail
          for override in AWS_ENDPOINT_URL_S3 AWS_ENDPOINT_URL_STS AWS_CA_BUNDLE NODE_EXTRA_CA_CERTS; do
            if env "$override=https://mock.example.invalid" node \
              pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs \
              > /tmp/paper-worm-operator-denial.log 2>&1; then
              echo "::error::Unsafe operator override admitted: $override"
              exit 1
            fi
            grep -qx 'REFUSED: WORM_CUSTODY_OPERATOR_CONFIGURATION' \
              /tmp/paper-worm-operator-denial.log
          done
          rm -f /tmp/paper-worm-operator-denial.log
      - name: Install exact-version upstream Apache-2.0 AWS S3 SDK only in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/paper-s3-contract" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @aws-sdk/client-s3@3.1174.0 \
            @aws-sdk/client-sts@3.1174.0 \
            @aws-sdk/credential-providers@3.1174.0
          test -f "$RUNNER_TEMP/paper-s3-contract/node_modules/@aws-sdk/client-s3/dist-cjs/index.js"
      - name: Verify exact upstream S3 command types and fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          PAPER_OAUTH_S3_SDK_ENTRY="$RUNNER_TEMP/paper-s3-contract/node_modules/@aws-sdk/client-s3/dist-cjs/index.js" \
            node pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          PAPER_WORM_SDK_ROOT="$RUNNER_TEMP/paper-s3-contract" \
            node pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
          node pod-provider/backend/scripts/proof-oauth-portable-s3-custody.mjs
          if env PAPER_PORTABLE_WORM_OPERATOR_CONFIRM=read-only-verified \
            PAPER_WORM_SDK_ROOT="$RUNNER_TEMP/paper-s3-contract" \
            PAPER_PORTABLE_WORM_PROVIDER=filebase \
            PAPER_PORTABLE_WORM_ENDPOINT=https://s3.filebase.com/ \
            PAPER_PORTABLE_WORM_READER_PROFILE=not-real \
            PAPER_PORTABLE_WORM_BUCKET=not-real-test \
            PAPER_PORTABLE_WORM_PHASE=preflight \
            node pod-provider/backend/scripts/probe-oauth-portable-s3-custody.mjs > /tmp/portable-worm-unqualified.log 2>&1; then
            echo '::error::Filebase unexpectedly qualified as a COMPLIANCE Object Lock provider'
            exit 1
          fi
          grep -qx 'REFUSED: PORTABLE_WORM_PROVIDER_UNSUPPORTED' /tmp/portable-worm-unqualified.log
          rm -f /tmp/portable-worm-unqualified.log
          if env PAPER_PORTABLE_WORM_OPERATOR_CONFIRM=read-only-verified \
            PAPER_WORM_SDK_ROOT="$RUNNER_TEMP/paper-s3-contract" \
            PAPER_PORTABLE_WORM_PROVIDER=custom-s3 \
            PAPER_PORTABLE_WORM_ENDPOINT=https://objects.vendor-domain.com/ \
            PAPER_PORTABLE_WORM_REGION=us-east-1 \
            PAPER_PORTABLE_WORM_READER_PROFILE=not-real \
            PAPER_PORTABLE_WORM_BUCKET=not-real-test \
            PAPER_PORTABLE_WORM_PHASE=preflight \
            node pod-provider/backend/scripts/probe-oauth-portable-s3-custody.mjs > /tmp/portable-worm-unpinned.log 2>&1; then
            echo '::error::Unpinned generic S3 endpoint was accepted'
            exit 1
          fi
          grep -qx 'REFUSED: PORTABLE_WORM_ENDPOINT_NOT_PINNED' /tmp/portable-worm-unpinned.log
          rm -f /tmp/portable-worm-unpinned.log
          if env PAPER_PORTABLE_WORM_OPERATOR_CONFIRM=disposable-write-approved \
            PAPER_PORTABLE_WORM_WRITE_DISPOSABLE=confirmed \
            PAPER_WORM_SDK_ROOT="$RUNNER_TEMP/paper-s3-contract" \
            PAPER_PORTABLE_WORM_PROVIDER=storj \
            PAPER_PORTABLE_WORM_ENDPOINT=https://gateway.storjshare.io/ \
            PAPER_PORTABLE_WORM_READER_PROFILE=not-real-read \
            PAPER_PORTABLE_WORM_WRITER_PROFILE=not-real-write \
            PAPER_PORTABLE_WORM_BUCKET=paper-worm-disposable-qafixture \
            node pod-provider/backend/scripts/probe-oauth-portable-s3-writeonce.mjs > /tmp/portable-worm-write-unsafe.log 2>&1; then
            echo '::error::Missing irreversible-bucket acknowledgement admitted'
            exit 1
          fi
          grep -qx 'REFUSED: PORTABLE_WORM_WRITE_CONFIGURATION_UNSAFE' /tmp/portable-worm-write-unsafe.log
          rm -f /tmp/portable-worm-write-unsafe.log
