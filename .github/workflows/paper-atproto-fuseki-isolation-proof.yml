name: ATProto protected Fuseki write-isolation candidate — disposable

on:
  pull_request:
    paths:
      - '.github/workflows/paper-atproto-fuseki-isolation-proof.yml'
      - 'pod-provider/docker-compose-fuseki-isolation.yml'
      - 'pod-provider/scripts/fixtures/fuseki-isolation-shiro.ini'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disposable-credential-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: atproto_signed_repo_proof_test
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: probe_local_only
        ports:
          - 5548:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d atproto_signed_repo_proof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
      ATPROTO_PROJECTION_ROLE_TEST_DISPOSABLE: confirmed
      ATPROTO_FUSEKI_ISOLATION_DISPOSABLE: confirmed
      FUSEKI_ISOLATION_URL: http://127.0.0.1:3041
      ATPROTO_REPO_PROOF_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5548/atproto_signed_repo_proof_test
    defaults:
      run:
        working-directory: pod-provider
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check isolated verifier syntax
        run: |
          set -euo pipefail
          node --check backend/candidates/atproto-signed-repo-proof/fuseki-writer-isolation-live.mjs
          node --check backend/candidates/atproto-signed-repo-proof/pg-protected-rdf-attestor-role.mjs
          node --check backend/candidates/atproto-signed-repo-proof/protected-rdf-attestor.mjs
          node --check backend/candidates/atproto-signed-repo-proof/pg-attested-projection-ops.mjs
          node --check backend/candidates/atproto-signed-repo-proof/protected-rdf-attested-live.mjs

      - name: Prepare fresh temporary Fuseki security configuration
        run: |
          set -euo pipefail
          sudo rm -rf data/fuseki_isolation
          mkdir -p data/fuseki_isolation
          cp scripts/fixtures/fuseki-isolation-shiro.ini data/fuseki_isolation/shiro.ini
          chmod 0644 data/fuseki_isolation/shiro.ini
          docker compose -p paper-fuseki-isolation -f docker-compose-fuseki-isolation.yml up -d
          # A default entrypoint may silently replace the role/URL policy.
          # Fail before any admission proof if the mounted file was altered.
          cmp scripts/fixtures/fuseki-isolation-shiro.ini data/fuseki_isolation/shiro.ini

      - name: Prove protected/ordinary SQL-independent TDB2 admission boundaries
        env:
          NODE_ENV: test
          ATPROTO_FUSEKI_ISOLATION_DISPOSABLE: confirmed
          FUSEKI_ISOLATION_URL: http://127.0.0.1:3041
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/fuseki-writer-isolation-live.mjs prepare

      - name: Install locked signed-PG proof dependencies
        run: |
          set -euo pipefail
          npm ci --prefix backend/candidates/atproto-signed-repo-proof --ignore-scripts --no-audit --no-fund

      - name: Verify independent PG18 attestor, protected Jena RDF and revocation race
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/protected-rdf-attested-live.mjs prepare

      - name: Restart persistent Fuseki for independent readback
        run: |
          set -euo pipefail
          docker compose -p paper-fuseki-isolation -f docker-compose-fuseki-isolation.yml restart fuseki_isolation

      - name: Prove no cross-credential mutation after restart
        env:
          NODE_ENV: test
          ATPROTO_FUSEKI_ISOLATION_DISPOSABLE: confirmed
          FUSEKI_ISOLATION_URL: http://127.0.0.1:3041
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/fuseki-writer-isolation-live.mjs verify

      - name: Prove independent protected-RDF receipt after persistent Jena restart
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/protected-rdf-attested-live.mjs verify

      - name: Destroy disposable PostgreSQL schemas and restricted credentials
        if: always()
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/protected-rdf-attested-live.mjs cleanup

      - name: Inspect failed disposable Fuseki
        if: failure()
        run: |
          docker compose -p paper-fuseki-isolation -f docker-compose-fuseki-isolation.yml logs --tail=120 fuseki_isolation || true

      - name: Remove isolated container and all disposable storage
        if: always()
        run: |
          docker compose -p paper-fuseki-isolation -f docker-compose-fuseki-isolation.yml down -v --remove-orphans || true
          sudo rm -rf data/fuseki_isolation
