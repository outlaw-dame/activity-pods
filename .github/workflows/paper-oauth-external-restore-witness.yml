name: Paper OAuth independent PostgreSQL restore witness — two PG18 clusters

on:
  pull_request:
    paths:
      - '.github/workflows/paper-oauth-external-restore-witness.yml'
      - 'pod-provider/backend/sql/paper-oauth-external-restore-witness-v1.sql'
      - 'pod-provider/backend/scripts/proof-oauth-external-witness.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-oauth-external-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-restore-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      canonical:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: probe_local_only
          POSTGRES_DB: atproto_signed_repo_proof_test
        ports:
          - 5549:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d atproto_signed_repo_proof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      independent-witness:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: witness_probe
          POSTGRES_PASSWORD: fixture_witness_only
          POSTGRES_DB: oauth_witness_disposable
        ports:
          - 5550:5432
        options: >-
          --health-cmd "pg_isready -U witness_probe -d oauth_witness_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6398:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PAPER_OAUTH_PG_RESTORE_DISPOSABLE: confirmed
      PAPER_OAUTH_EPOCH_REDIS_DISPOSABLE: confirmed
      PAPER_OAUTH_WITNESS_DISPOSABLE: confirmed
      PAPER_OAUTH_PG_RESTORE_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5549/atproto_signed_repo_proof_test
      PAPER_OAUTH_WITNESS_DSN: postgres://witness_probe:fixture_witness_only@127.0.0.1:5550/oauth_witness_disposable
      PAPER_OAUTH_EPOCH_REDIS_URL: redis://127.0.0.1:6398
    steps:
      - name: Checkout trusted exact-head source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject test gate bypass or invalid syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check pod-provider/backend/scripts/proof-oauth-external-witness.mjs
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-oauth-external-restore-witness-v1.sql
          if grep -R -n 'paper-oauth-external-restore-witness-v1.sql' pod-provider/backend/services; then
            echo '::error::The independent witness candidate must not be auto-migrated by the production provider'
            exit 1
          fi
      - name: Install locked backend without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Prove independent PG18 witness blocks restored PG and Redis
        shell: bash
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-oauth-external-witness.mjs
