name: Paper Groups G2 — Manifest Publication Fencing

on:
  pull_request:
    paths:
      - 'pod-provider/backend/utils/collective-membership-publication.js'
      - 'pod-provider/backend/tests/collective-membership-publication.test.js'
      - 'pod-provider/backend/scripts/proof-collective-publication-fuseki.js'
      - '.github/workflows/paper-groups-g2-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Check publication source syntax
        run: |
          node --check pod-provider/backend/utils/collective-membership-publication.js
          node --check pod-provider/backend/tests/collective-membership-publication.test.js
          node --check pod-provider/backend/scripts/proof-collective-publication-fuseki.js
      - name: Run permission- and epoch-fenced publication tests
        run: |
          set -euo pipefail
          NODE_ENV=test npm exec --yes --package=jest@29.7.0 -- jest \
            --runInBand --testEnvironment=node --runTestsByPath \
            pod-provider/backend/tests/collective-membership-publication.test.js
      - name: Prove real TDB2 seal, stale epoch, publication and replay
        working-directory: pod-provider
        env:
          FUSEKI_URL: http://127.0.0.1:3040
          FUSEKI_USER: admin
          FUSEKI_PASSWORD: admin
          G2_BENCH_DISPOSABLE: confirmed
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
          mkdir -p data/fuseki_test
          docker compose -f docker-compose-test.yml up -d fuseki_test
          FUSEKI_URL=http://127.0.0.1:3040 WAIT_SECONDS=120 ./scripts/fuseki-bootstrap.sh
          node backend/scripts/proof-collective-publication-fuseki.js
      - name: Logs on proof failure
        if: failure()
        working-directory: pod-provider
        run: docker compose -f docker-compose-test.yml logs --no-color --tail=100 fuseki_test
      - name: Delete disposable TDB2
        if: always()
        working-directory: pod-provider
        run: |
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
