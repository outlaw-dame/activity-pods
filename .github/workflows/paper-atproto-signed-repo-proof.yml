name: ATProto signed repository v3 — disposable PostgreSQL 18 proof

on:
  pull_request:
    paths:
      - '.github/workflows/paper-atproto-signed-repo-proof.yml'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/**'
  workflow_dispatch:

# Never accumulate an unbounded queue of expensive PG/Jena and backend builds
# for superseded commits on the same PR. Other PRs stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-empty-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: atproto_signed_repo_proof_test
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: probe_local_only
        ports:
          - 5548:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d atproto_signed_repo_proof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout trusted PR code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/genesis.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/store.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/proof.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/reference-interop.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/provider-authority.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/provider-moleculer.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/provider-authority.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/projection-recovery.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/projection-recovery.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/fuseki-fence.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/fuseki-fence-proof.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/cross-store-live.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-account-lookup.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-account-lookup.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-consent-fence.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-operation-ticket.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-activitypods-adapter.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-per-user-live.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pod-fence-child.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pg-lease-ticket.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/new-signup-cross-authority.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/new-signup-cross-authority.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/sync-xrpc-candidate.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/sync-xrpc-candidate.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/signed-single-record.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/single-record-writer.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/single-record-writer.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/native-outbox-dispatch.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/native-outbox-dispatch.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/signed-record-projection.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/pg-generation-ticket.test.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/reference-mst-writer.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/reference-mst-writer.test.mjs
          node --check pod-provider/backend/candidates/postgres-account-lifecycle.js

      - name: Install integrity-locked proof dependencies (no lifecycle scripts)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix pod-provider/backend/candidates/atproto-signed-repo-proof \
            --ignore-scripts --no-audit --no-fund

      - name: Check for high/critical dependency advisories
        shell: bash
        run: |
          npm audit --prefix pod-provider/backend/candidates/atproto-signed-repo-proof \
            --omit=dev --audit-level=high

      - name: Run complete signed-repository and transaction acceptance
        env:
          ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
          PAPER_ACCOUNTS_DISPOSABLE: confirmed
          ATPROTO_REPO_PROOF_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5548/atproto_signed_repo_proof_test
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix pod-provider/backend/candidates/atproto-signed-repo-proof

      - name: Independently verify against Bluesky reference repository implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atproto-reference"
          npm install --prefix "$RUNNER_TEMP/atproto-reference" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @atproto/repo@0.11.0
          export ATPROTO_REFERENCE_REPO_ENTRY="$RUNNER_TEMP/atproto-reference/node_modules/@atproto/repo/dist/index.js"
          test -f "$ATPROTO_REFERENCE_REPO_ENTRY"
          node pod-provider/backend/candidates/atproto-signed-repo-proof/reference-interop.mjs
          # The full-MST candidate is still nonactivated and cannot pull a
          # runtime version from npm. The exact same separately pinned
          # upstream library is injected for its disposable PG18 proof.
          ATPROTO_REPO_PROOF_DISPOSABLE=confirmed \
          ATPROTO_REPO_PROOF_DSN=postgres://paper_probe:probe_local_only@127.0.0.1:5548/atproto_signed_repo_proof_test \
            node --test pod-provider/backend/candidates/atproto-signed-repo-proof/reference-mst-writer.test.mjs


  real-fuseki-rdf-projection-fence:
    name: Real PG18 + Jena TDB2 cross-store crash/fencing and restart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: atproto_signed_repo_proof_test
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: probe_local_only
        ports:
          - 5548:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d atproto_signed_repo_proof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: pod-provider
    steps:
      - name: Checkout candidate proof
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run disposable Fuseki TDB2
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
          mkdir -p data/fuseki_test
          docker compose -f docker-compose-test.yml up -d fuseki_test
          FUSEKI_URL=http://127.0.0.1:3040 WAIT_SECONDS=120 ./scripts/fuseki-bootstrap.sh

      - name: Prove real Jena conditional write, stale-fence rejection and contention
        env:
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/fuseki-fence-proof.mjs prepare

      - name: Install locked PG18 proof dependencies (no lifecycle scripts)
        run: |
          set -euo pipefail
          npm ci --prefix backend/candidates/atproto-signed-repo-proof --ignore-scripts --no-audit --no-fund

      - name: Prove combined real PG18 and Fuseki cross-store crash recovery
        env:
          ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          ATPROTO_REPO_PROOF_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5548/atproto_signed_repo_proof_test
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/cross-store-live.mjs prepare

      - name: Prove real per-user Pod Jena consent and grant-fenced write
        env:
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/pod-per-user-live.mjs prepare

      - name: Restart persistent Fuseki TDB2
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml restart fuseki_test
          FUSEKI_URL=http://127.0.0.1:3040 WAIT_SECONDS=120 ./scripts/fuseki-bootstrap.sh

      - name: Verify fenced RDF projection persisted over restart
        env:
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/fuseki-fence-proof.mjs verify

      - name: Verify combined signed PostgreSQL and Jena state after restart
        env:
          ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          ATPROTO_REPO_PROOF_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5548/atproto_signed_repo_proof_test
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/cross-store-live.mjs verify

      - name: Verify per-user grant/revocation durability after Fuseki restart
        env:
          ATPROTO_REPO_FUSEKI_PROOF_DISPOSABLE: confirmed
          FUSEKI_URL: http://127.0.0.1:3040
        run: |
          set -euo pipefail
          node backend/candidates/atproto-signed-repo-proof/pod-per-user-live.mjs verify

      - name: Fuseki diagnostics
        if: failure()
        run: docker compose -f docker-compose-test.yml logs --no-color --tail=160 fuseki_test

      - name: Destroy disposable RDF dataset
        if: always()
        run: |
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
