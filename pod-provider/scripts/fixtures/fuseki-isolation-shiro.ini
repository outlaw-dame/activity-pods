# Disposable CI fixture ONLY. Plaintext credentials must never be deployed.
# Apache Jena Fuseki Full / Apache Shiro: first matching URL rule wins.
# Authoritative docs: https://jena.apache.org/documentation/fuseki2/fuseki-security.html
[users]
fixture-admin = fixture-admin-only,admins
fixture-projector = fixture-projector-only,projectors
fixture-ordinary = fixture-ordinary-only,ordinary

[urls]
/$/ping = anon
/$/** = authcBasic,roles[admins]
/protected-proof/query = authcBasic,roles[projectors]
/protected-proof/update = authcBasic,roles[projectors]
/protected-proof/** = authcBasic,roles[projectors]
/protected-proof = authcBasic,roles[projectors]
/ordinary-proof/query = authcBasic,roles[ordinary]
/ordinary-proof/update = authcBasic,roles[ordinary]
/ordinary-proof/** = authcBasic,roles[ordinary]
/ordinary-proof = authcBasic,roles[ordinary]
/** = authcBasic,roles[admins]
