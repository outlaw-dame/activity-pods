name: Paper Groups G2 — Bounded Fanout Planning

on:
  pull_request:
    paths:
      - 'pod-provider/backend/utils/collective-fanout-plan.js'
      - 'pod-provider/backend/utils/collective-membership-cursor.js'
      - 'pod-provider/backend/tests/collective-membership-cursor.node-test.js'
      - 'pod-provider/backend/tests/collective-fanout-plan.test.js'
      - 'pod-provider/backend/tests/collective-fanout-plan.node-test.js'
      - 'pod-provider/backend/scripts/benchmark-collective-fanout-plan.js'
      - 'docs/paper-groups-g2-delivery-architecture.md'
      - '.github/workflows/paper-groups-g2-fanout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-fanout-kernel:
    name: no-I/O Group local and remote planning proof
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check bounded planning implementation and tests
        run: |
          node --check pod-provider/backend/utils/collective-fanout-plan.js
          node --check pod-provider/backend/utils/collective-membership-cursor.js
          node --check pod-provider/backend/tests/collective-membership-cursor.node-test.js
          node --check pod-provider/backend/tests/collective-fanout-plan.test.js
          node --check pod-provider/backend/tests/collective-fanout-plan.node-test.js
          node --check pod-provider/backend/scripts/benchmark-collective-fanout-plan.js
      - name: Run real native Node contract tests without backend dependencies
        run: node --test pod-provider/backend/tests/collective-fanout-plan.node-test.js pod-provider/backend/tests/collective-membership-cursor.node-test.js
      - name: Run planning workload at 1, 10, 100 and 1000 local/remote recipients
        run: |
          node pod-provider/backend/scripts/benchmark-collective-fanout-plan.js > /tmp/g2-plan-results.json
          cat /tmp/g2-plan-results.json
      - name: Assert no network and service call paths exist
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('pod-provider/backend/utils/collective-fanout-plan.js', 'utf8');
          assert(!/(?:ctx|broker)\.call\s*\(|\bfetch\s*\(|\baxios\s*\(|new Redis\s*\(|\.createJob\s*\(/u.test(source));
          const results = JSON.parse(fs.readFileSync('/tmp/g2-plan-results.json', 'utf8')).results;
          assert.equal(results.length, 8);
          assert(results.every(x => x.callsToMoleculer === 0 && x.fusekiRequests === 0 && x.remoteHttpRequests === 0));
          assert(results.filter(x => x.topology === 'remote').every(x => x.batches === 1),
            'A sharedInbox must produce one destination intent regardless of recipient count');
          console.log('PASS: bounded Group planning with zero broker/HTTP/Fuseki work');
          NODE
