name: Paper OAuth immutable S3 COMPLIANCE readback contract — NONACTIVATED

on:
  pull_request:
    paths:
      - '.github/workflows/paper-oauth-s3-compliance-archive.yml'
      - 'pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs'
      - 'pod-provider/backend/candidates/oauth-r2-receipt-archive.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs'
      - 'pod-provider/backend/candidates/oauth-s3-independent-custody.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs'
      - 'pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-oauth-s3-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s3-compliance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      PAPER_OAUTH_S3_COMPLIANCE_DISPOSABLE: confirmed
    steps:
      - name: Checkout immutable PR source without GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject source syntax or accidental production activation
        shell: bash
        run: |
          set -euo pipefail
          node --check pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs
          node --check pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          node --check pod-provider/backend/candidates/oauth-r2-receipt-archive.mjs
          node --check pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs
          node pod-provider/backend/scripts/proof-oauth-r2-receipt-archive.mjs
          node --check pod-provider/backend/candidates/oauth-s3-independent-custody.mjs
          node --check pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
          node --check pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs
          grep -q 'NONACTIVATED' pod-provider/backend/candidates/oauth-s3-compliance-archive.mjs
          if grep -R -nE 'oauth-(s3-(compliance-archive|independent-custody)|r2-receipt-archive)' pod-provider/backend/services; then
            echo '::error::Do not wire an unapproved S3 adapter or custody probe into production services'
            exit 1
          fi
      - name: Run deterministic fail-closed archival contract
        shell: bash
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          node pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
      - name: Reject operator endpoint and custom CA spoofing before SDK startup
        shell: bash
        env:
          NODE_ENV: production
          PAPER_WORM_CUSTODY_OPERATOR_CONFIRM: read-only-verified
          PAPER_WORM_SDK_ROOT: /tmp/nonexistent-worm-sdk
          PAPER_WORM_PROVIDER_PROFILE: provider-fake
          PAPER_WORM_READER_PROFILE: archive-fake
          PAPER_WORM_PROVIDER_ACCOUNT_ID: "111122223333"
          PAPER_WORM_ARCHIVE_ACCOUNT_ID: "999988887777"
          PAPER_WORM_BUCKET: paper-disposable-only
          PAPER_WORM_REGION: us-east-1
          PAPER_WORM_CUSTODY_PHASE: preflight
        run: |
          set -euo pipefail
          for override in AWS_ENDPOINT_URL_S3 AWS_ENDPOINT_URL_STS AWS_CA_BUNDLE NODE_EXTRA_CA_CERTS; do
            if env "$override=https://mock.example.invalid" node \
              pod-provider/backend/scripts/probe-oauth-independent-s3-custody.mjs \
              > /tmp/paper-worm-operator-denial.log 2>&1; then
              echo "::error::Unsafe operator override admitted: $override"
              exit 1
            fi
            grep -qx 'REFUSED: WORM_CUSTODY_OPERATOR_CONFIGURATION' \
              /tmp/paper-worm-operator-denial.log
          done
          rm -f /tmp/paper-worm-operator-denial.log
      - name: Install exact-version upstream Apache-2.0 AWS S3 SDK only in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/paper-s3-contract" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @aws-sdk/client-s3@3.1174.0 \
            @aws-sdk/client-sts@3.1174.0 \
            @aws-sdk/credential-providers@3.1174.0
          test -f "$RUNNER_TEMP/paper-s3-contract/node_modules/@aws-sdk/client-s3/dist-cjs/index.js"
      - name: Verify exact upstream S3 command types and fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          PAPER_OAUTH_S3_SDK_ENTRY="$RUNNER_TEMP/paper-s3-contract/node_modules/@aws-sdk/client-s3/dist-cjs/index.js" \
            node pod-provider/backend/scripts/proof-oauth-s3-compliance-archive.mjs
          PAPER_WORM_SDK_ROOT="$RUNNER_TEMP/paper-s3-contract" \
            node pod-provider/backend/scripts/proof-oauth-s3-independent-custody.mjs
