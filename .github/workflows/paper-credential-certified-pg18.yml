name: Paper credential signed latest head + real PG18 — nonactivated

on:
  pull_request:
    paths:
      - '.github/workflows/paper-credential-certified-pg18.yml'
      - 'pod-provider/backend/candidates/credential-signed-latest-head.js'
      - 'pod-provider/backend/candidates/credential-pg-certified-reader.js'
      - 'pod-provider/backend/sql/paper-credential-epoch-authority-v2-certified-head.sql'
      - 'pod-provider/backend/sql/paper-atproto-canonical-authority-v8-post-enrollment-read.sql'
      - 'pod-provider/backend/candidates/oauth-post-enrollment-owner-reader.cjs'
      - 'pod-provider/backend/scripts/proof-oauth-post-enrollment-owner-pg18.cjs'
      - 'pod-provider/backend/scripts/proof-paper-credential-certified-pg18.cjs'
      - 'docs/paper-canonical-credential-revocation-gate.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-credential-certified-pg18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-certified-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: proof_disposable_only
          POSTGRES_DB: paper_credential_head_test
        ports:
          - 5548:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d paper_credential_head_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      NODE_ENV: test
      PAPER_CREDENTIAL_HEAD_DISPOSABLE: confirmed
      PAPER_CREDENTIAL_EPOCH_DISPOSABLE: confirmed
      PAPER_CREDENTIAL_PG_DISPOSABLE: confirmed
      PAPER_OAUTH_POST_ENROLLMENT_DISPOSABLE: confirmed
      PAPER_OAUTH_WITNESS_DISPOSABLE: confirmed
      PAPER_OAUTH_WORM_HIGHWATER_DISPOSABLE: confirmed
      PGHOST: 127.0.0.1
      PGPORT: '5548'
      PGDATABASE: paper_credential_head_test
      PGUSER: paper_probe
      PGPASSWORD: proof_disposable_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject activated candidate or invalid Node modules
        run: |
          set -euo pipefail
          node --check pod-provider/backend/candidates/credential-signed-latest-head.js
          node --check pod-provider/backend/candidates/credential-pg-certified-reader.js
          node --check pod-provider/backend/scripts/proof-paper-credential-certified-pg18.cjs
          node --check pod-provider/backend/candidates/oauth-post-enrollment-owner-reader.cjs
          node --check pod-provider/backend/scripts/proof-oauth-post-enrollment-owner-pg18.cjs
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-atproto-canonical-authority-v8-post-enrollment-read.sql
          if grep -R -n -e 'oauth-post-enrollment-owner-reader' -e 'v8-post-enrollment-read.sql' pod-provider/backend/services pod-provider/backend/moleculer.config.js; then
            echo '::error::Post-enrollment owner admission must remain nonactivated'
            exit 1
          fi
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-credential-epoch-authority-v2-certified-head.sql
          if grep -R -n -e 'credential-pg-certified-reader' -e 'paper-credential-epoch-authority-v2-certified-head.sql' pod-provider/backend/moleculer.config.js pod-provider/backend/services; then
            echo '::error::Verified credential reader cannot be registered by a production service before release'
            exit 1
          fi
      - name: Install locked backend library without lifecycle hooks
        run: npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Challenge/replay, two-head race and PG18 role/rollback proof
        run: node pod-provider/backend/scripts/proof-paper-credential-certified-pg18.cjs
      - name: Real PG18 post-enrollment managed WebID + SAI + OAuth + certified owner reader
        run: node pod-provider/backend/scripts/proof-oauth-post-enrollment-owner-pg18.cjs
