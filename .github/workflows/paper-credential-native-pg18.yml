name: Paper native credential mutation + restricted PG18 — nonactivated
on:
  pull_request:
    paths:
      - '.github/workflows/paper-credential-native-pg18.yml'
      - 'pod-provider/backend/sql/paper-credential-epoch-authority-v3-native-bcrypt.sql'
      - 'pod-provider/backend/sql/paper-local-native-auth.sql'
      - 'pod-provider/backend/scripts/proof-paper-credential-native-bcrypt.cjs'
      - 'docs/paper-canonical-credential-revocation-gate.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-password-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: credential_native_test
        ports:
          - 5553:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d credential_native_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      NODE_ENV: test
      PAPER_CREDENTIAL_PG_DISPOSABLE: confirmed
      PAPER_CREDENTIAL_NATIVE_DISPOSABLE: confirmed
      PGHOST: 127.0.0.1
      PGPORT: '5553'
      PGDATABASE: credential_native_test
      PGUSER: paper_probe
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse production SQL auto-wiring and check script
        run: |
          set -euo pipefail
          node --check pod-provider/backend/scripts/proof-paper-credential-native-bcrypt.cjs
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-credential-epoch-authority-v3-native-bcrypt.sql
          grep -q 'PAPER_CREDENTIAL_NATIVE_DISPOSABLE' pod-provider/backend/scripts/proof-paper-credential-native-bcrypt.cjs
          if grep -R -n 'paper-credential-epoch-authority-v3-native-bcrypt.sql' pod-provider/backend/services pod-provider/backend/moleculer.config.js; then
            echo '::error::Native credential schema must not auto-migrate into production'
            exit 1
          fi
      - name: Install pinned backend PG driver
        run: npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Prove restricted native-account bcrypt mutation and receipt
        run: node pod-provider/backend/scripts/proof-paper-credential-native-bcrypt.cjs
