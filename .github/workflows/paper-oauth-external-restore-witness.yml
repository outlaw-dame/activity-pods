name: Paper OAuth independent PostgreSQL restore witness — two PG18 clusters

on:
  pull_request:
    paths:
      - '.github/workflows/paper-oauth-external-restore-witness.yml'
      - 'pod-provider/backend/sql/paper-oauth-external-restore-witness-v1.sql'
      - 'pod-provider/backend/sql/paper-oauth-external-restore-witness-v2-writer-intents.sql'
      - 'pod-provider/backend/sql/paper-oauth-external-restore-witness-v3-bound-commit-intents.sql'
      - 'pod-provider/backend/sql/paper-oauth-external-restore-witness-v4-commit-only-reconciliation.sql'
      - 'pod-provider/backend/scripts/proof-oauth-external-witness.mjs'
      - 'pod-provider/backend/scripts/proof-oauth-worm-epoch-attestor.mjs'
      - 'pod-provider/backend/candidates/oauth-worm-epoch-attestor.mjs'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/reference-mst-writer.mjs'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/independent-witness-commit-reconciler.mjs'
      - 'pod-provider/backend/candidates/atproto-signed-repo-proof/pg-witness-signed-head-correlation.sql'
      - 'pod-provider/backend/candidates/oauth-external-witness-reader.js'
      - 'pod-provider/backend/utils/oauth-pg-epoch-policy.js'
      - 'pod-provider/backend/services/oauth/oauth-token.service.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-oauth-external-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-restore-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      canonical:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_probe
          POSTGRES_PASSWORD: probe_local_only
          POSTGRES_DB: atproto_signed_repo_proof_test
        ports:
          - 5549:5432
        options: >-
          --health-cmd "pg_isready -U paper_probe -d atproto_signed_repo_proof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      independent-witness:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: witness_probe
          POSTGRES_PASSWORD: fixture_witness_only
          POSTGRES_DB: oauth_witness_disposable
        ports:
          - 5550:5432
        options: >-
          --health-cmd "pg_isready -U witness_probe -d oauth_witness_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.2.11-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
        ports:
          - 6398:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      SEMAPPS_AVAILABLE_LOCALES: en
      SEMAPPS_AUTH_RESERVED_USER_NAMES: admin,root
      SEMAPPS_HOME_URL: https://paper.example.org
      PAPER_OAUTH_PG_EPOCH_DISPOSABLE: confirmed
      PAPER_OAUTH_PG_RESTORE_DISPOSABLE: confirmed
      PAPER_OAUTH_EPOCH_REDIS_DISPOSABLE: confirmed
      PAPER_OAUTH_WITNESS_DISPOSABLE: confirmed
      PAPER_OAUTH_WORM_READBACK_DISPOSABLE: confirmed
      PAPER_OAUTH_WITNESS_SIGNED_REPO_DISPOSABLE: confirmed
      ATPROTO_REPO_PROOF_DISPOSABLE: confirmed
      PAPER_OAUTH_PG_RESTORE_DSN: postgres://paper_probe:probe_local_only@127.0.0.1:5549/atproto_signed_repo_proof_test
      PAPER_OAUTH_WITNESS_DSN: postgres://witness_probe:fixture_witness_only@127.0.0.1:5550/oauth_witness_disposable
      PAPER_OAUTH_EPOCH_REDIS_URL: redis://127.0.0.1:6398
    steps:
      - name: Checkout trusted exact-head source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject test gate bypass or invalid syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check pod-provider/backend/scripts/proof-oauth-external-witness.mjs
          node --check pod-provider/backend/scripts/proof-oauth-worm-epoch-attestor.mjs
          node --check pod-provider/backend/candidates/oauth-worm-epoch-attestor.mjs
          grep -q 'NONACTIVATED' pod-provider/backend/candidates/oauth-worm-epoch-attestor.mjs
          node --check pod-provider/backend/candidates/oauth-external-witness-reader.js
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/reference-mst-writer.mjs
          node --check pod-provider/backend/candidates/atproto-signed-repo-proof/independent-witness-commit-reconciler.mjs
          grep -q 'NONACTIVATED' pod-provider/backend/candidates/atproto-signed-repo-proof/pg-witness-signed-head-correlation.sql
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-oauth-external-restore-witness-v1.sql
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-oauth-external-restore-witness-v2-writer-intents.sql
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-oauth-external-restore-witness-v3-bound-commit-intents.sql
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-oauth-external-restore-witness-v4-commit-only-reconciliation.sql
          if grep -R -n 'paper-oauth-external-restore-witness-v1.sql' pod-provider/backend/services; then
            echo '::error::The independent witness candidate must not be auto-migrated by the production provider'
            exit 1
          fi
      - name: Install locked backend without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix pod-provider/backend --ignore-scripts --no-audit --no-fund
      - name: Install locked signed-repo proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix pod-provider/backend/candidates/atproto-signed-repo-proof \
            --ignore-scripts --no-audit --no-fund
      - name: Load separately pinned upstream Bluesky reference MST
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/witness-atproto-reference" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund \
            @atproto/repo@0.11.0 kafkajs@2.2.4
          test -f "$RUNNER_TEMP/witness-atproto-reference/node_modules/@atproto/repo/dist/index.js"
      - name: Prove independent immutable receipt readback candidate
        shell: bash
        run: |
          set -euo pipefail
          node pod-provider/backend/scripts/proof-oauth-worm-epoch-attestor.mjs
      - name: Prove independent PG18 witness blocks restored PG and Redis
        shell: bash
        run: |
          set -euo pipefail
          ATPROTO_REFERENCE_REPO_ENTRY="$RUNNER_TEMP/witness-atproto-reference/node_modules/@atproto/repo/dist/index.js" \
            node pod-provider/backend/scripts/proof-oauth-external-witness.mjs
