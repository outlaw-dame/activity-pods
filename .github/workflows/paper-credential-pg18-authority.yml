name: Paper credential PostgreSQL18 authority — nonactivated

on:
  pull_request:
    paths:
      - '.github/workflows/paper-credential-pg18-authority.yml'
      - 'pod-provider/backend/sql/paper-credential-epoch-authority-v1.sql'
      - 'pod-provider/backend/scripts/proof-paper-credential-pg18.sh'
      - 'docs/paper-canonical-credential-revocation-gate.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: paper-credential-pg18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  credential-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: disposable_only
          POSTGRES_DB: credential_test
        ports:
          - 5547:5432
        options: >-
          --health-cmd "pg_isready -U paper_test -d credential_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate strict CI-only guards and shell
        run: |
          set -euo pipefail
          bash -n pod-provider/backend/scripts/proof-paper-credential-pg18.sh
          grep -q 'NONACTIVATED' pod-provider/backend/sql/paper-credential-epoch-authority-v1.sql
          grep -q 'PAPER_CREDENTIAL_PG_DISPOSABLE' pod-provider/backend/scripts/proof-paper-credential-pg18.sh
      - name: Test restricted roles and durable mutation protocol on real PostgreSQL 18
        env:
          CI: 'true'
          PAPER_CREDENTIAL_PG_DISPOSABLE: confirmed
          PGHOST: 127.0.0.1
          PGPORT: '5547'
          PGDATABASE: credential_test
          PGUSER: paper_test
          PGPASSWORD: disposable_only
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e CI -e PAPER_CREDENTIAL_PG_DISPOSABLE \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc \
            bash /work/pod-provider/backend/scripts/proof-paper-credential-pg18.sh
