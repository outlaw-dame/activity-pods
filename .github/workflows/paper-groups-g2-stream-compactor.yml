name: Paper Groups G2 — Bounded Streaming Compaction

on:
  pull_request:
    paths:
      - 'pod-provider/backend/utils/collective-membership-stream-compactor.js'
      - 'pod-provider/backend/tests/collective-membership-stream-compactor.test.js'
      - 'pod-provider/backend/scripts/proof-collective-stream-compaction-fuseki.js'
      - '.github/workflows/paper-groups-g2-stream-compactor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-compaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Check streaming source/test syntax
        run: |
          node --check pod-provider/backend/utils/collective-membership-stream-compactor.js
          node --check pod-provider/backend/tests/collective-membership-stream-compactor.test.js
          node --check pod-provider/backend/scripts/proof-collective-stream-compaction-fuseki.js
      - name: Execute bounded staged snapshot correctness tests
        run: |
          set -euo pipefail
          NODE_ENV=test npm exec --yes --package=jest@29.7.0 -- jest \
            --runInBand --testEnvironment=node --runTestsByPath \
            pod-provider/backend/tests/collective-membership-stream-compactor.test.js
      - name: Prove actual TDB2 compaction reads, writes and consent revocation
        working-directory: pod-provider
        env:
          FUSEKI_URL: http://127.0.0.1:3040
          FUSEKI_USER: admin
          FUSEKI_PASSWORD: admin
          G2_BENCH_DISPOSABLE: confirmed
        run: |
          set -euo pipefail
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
          mkdir -p data/fuseki_test
          docker compose -f docker-compose-test.yml up -d fuseki_test
          FUSEKI_URL=http://127.0.0.1:3040 WAIT_SECONDS=120 ./scripts/fuseki-bootstrap.sh
          node backend/scripts/proof-collective-stream-compaction-fuseki.js
      - name: Print local Fuseki diagnostics on failure
        if: failure()
        working-directory: pod-provider
        run: docker compose -f docker-compose-test.yml logs --no-color --tail=120 fuseki_test
      - name: Destroy disposable TDB2
        if: always()
        working-directory: pod-provider
        run: |
          docker compose -f docker-compose-test.yml down -v || true
          sudo rm -rf data/fuseki_test
